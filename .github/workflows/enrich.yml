name: Collecte positions et photos

# Interroge Wikidata, Wikimedia Commons et OpenStreetMap pour les fiches listées
# dans tools/enrich/targets.json ; le résultat est publié comme artefact, relu avant intégration.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/enrich/**']

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/enrich/enrich.mjs tools/enrich/targets.json out/enrichment.json
      - name: Déposer le résultat sur la branche enrichment-results
        run: |
          git config user.name "ruella-bot"
          git config user.email "ruella-bot@users.noreply.github.com"
          git checkout --orphan enrichment-results
          git rm -rq --cached .
          git add -f out/enrichment.json
          git commit -qm "Résultat de collecte ${{ github.run_id }}"
          git push -f origin HEAD:enrichment-results
