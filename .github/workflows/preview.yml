name: Démo sur téléphone (Expo Go)

# Publie chaque version de « main » pour l'ouvrir dans Expo Go.
# Prérequis : secret de dépôt EXPO_TOKEN (Settings › Secrets and variables › Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Lier le projet Expo
        run: eas init --non-interactive --force
      - name: Publier la démo
        run: eas update --branch preview --message "${{ github.event.head_commit.message || 'Démo manuelle' }}" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
