name: Collecte fond de carte

# Fleuve, canaux et parcs depuis OpenStreetMap (Overpass), simplifiés pour la carte légère de l'app.
# Une tâche par ville (Overpass limite le débit), puis regroupement sur la branche geo-results.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Villes (JSON)'
        default: '["prague","toulouse","paris","londres","rome","madrid","lisbonne","berlin","amsterdam","bruxelles","vienne","budapest"]'
  push:
    branches: [main]
    paths: ['tools/geo/**']

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        city: ${{ fromJSON(github.event.inputs.cities || '["prague","toulouse","paris","londres","rome","madrid","lisbonne","berlin","amsterdam","bruxelles","vienne","budapest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/geo/geo.mjs out/geo-${{ matrix.city }}.json ${{ matrix.city }}
      - uses: actions/upload-artifact@v4
        with:
          name: geo-${{ matrix.city }}
          path: out/geo-${{ matrix.city }}.json
  publish:
    needs: city
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Déposer le résultat sur la branche geo-results
        run: |
          git config user.name "ruella-bot"
          git config user.email "ruella-bot@users.noreply.github.com"
          git checkout --orphan geo-results
          git rm -rq --cached .
          git add -f out/geo-*.json
          git commit -qm "Fond de carte ${{ github.run_id }}"
          git push -f origin HEAD:geo-results
